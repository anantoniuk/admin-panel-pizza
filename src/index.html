<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza admin panel</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style/index.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Pizza</h1>
    </header>
    <main class="main">
      <aside data-pizza-aside class="aside">
        <ul class="action-list">
          <li class="action-item">
            <button class="action" data-action="refresh" class="refresh-btn">
              Refresh list
            </button>
          </li>
          <li class="action-item">
            <button class="action" data-action="create" class="create-btn">
              Add new pizza
            </button>
          </li>
        </ul>
      </aside>
      <section class="section pizza-section">
        <div class="container" data-pizzas-container></div>
      </section>
    </main>

    <script type="module" src="./index.js"></script>
  </body>
</html>
